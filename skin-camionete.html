<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin de Camionete - Marcelo Texturas</title>
    <!-- Fontes estilizadas do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #060913;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 140, 255, 0.25), transparent 70%),
                linear-gradient(rgba(0, 162, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 162, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            text-align: center;
            padding: 25px 15px;
            min-height: 100vh;
        }
        header {
            padding: 10px 10px 20px 10px;
            border-bottom: 2px solid rgba(0, 183, 255, 0.3);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00b7ff;
            margin-bottom: 10px;
            box-shadow: 0 0 20px rgba(0, 183, 255, 0.5);
        }
        .btn-back {
            display: inline-block;
            color: #00b7ff;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 15px;
            align-self: flex-start;
            padding: 6px 12px;
            border: 1px solid rgba(0, 183, 255, 0.4);
            border-radius: 6px;
            background: rgba(0, 183, 255, 0.1);
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .skin-preview-box {
            background: linear-gradient(160deg, #0d162a, #090e1a);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 183, 255, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            padding: 15px;
            text-align: center;
        }
        .skin-preview-img {
            width: 100%;
            border-radius: 10px;
            border: 1px solid rgba(0, 183, 255, 0.3);
            margin-bottom: 15px;
        }
        .skin-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .skin-desc {
            color: #a0b8d0;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        .code-input-container {
            margin-bottom: 15px;
        }
        .code-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 183, 255, 0.4);
            background-color: #050a14;
            color: #00b7ff;
            font-family: monospace;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 12px;
            outline: none;
        }
        .btn-copy {
            width: 100%;
            background: linear-gradient(90deg, #00b7ff, #0066ff);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 183, 255, 0.5);
            transition: background 0.2s;
        }
        .btn-copy:active {
            transform: scale(0.98);
        }
        footer {
            margin-top: 50px;
            color: #4a6584;
            font-size: 0.85rem;
            font-weight: 600;
            border-top: 1px solid rgba(0, 183, 255, 0.2);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="global-truck-online.html" class="btn-back">← Voltar para a lista</a>
            <img src="Marcelo Textura.png" alt="Marcelo Texturas" class="profile-img">
        </header>

        <div class="skin-preview-box">
            <img src="capa-camionete.png" alt="Skin Camionete" class="skin-preview-img">
            
            <h1 class="skin-title">🛻 Skin de Camionete</h1>
            <p class="skin-desc">Copie o código/URL da skin abaixo para colar direto dentro do jogo Global Truck Online.</p>

            <div class="code-input-container">
                <!-- Substitua o link abaixo pela URL da imagem da sua skin -->
                <input type="text" id="skinUrl" class="code-input" value="https://raw.githubusercontent.com/marcelo033k/marcelo-texturas/main/capa-camionete.png" readonly>
                <button class="btn-copy" onclick="copyCode()">Copiar Código da Skin</button>
            </div>
        </div>

        <footer>
            <p>© Marcelo Texturas - Todos os direitos reservados</p>
        </footer>
    </div>

    <script>
        function copyCode() {
            var copyText = document.getElementById("skinUrl");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            
            alert("Código copiado com sucesso! Agora é só colar no jogo.");
        }
    </script>

</body>
</html>
