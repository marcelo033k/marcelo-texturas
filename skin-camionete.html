<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skins de Camionete - Marcelo Texturas</title>
    <!-- Fontes estilizadas do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #060913;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 140, 255, 0.25), transparent 70%),
                linear-gradient(rgba(0, 162, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 162, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            text-align: center;
            padding: 25px 15px;
            min-height: 100vh;
        }
        header {
            padding: 10px 10px 20px 10px;
            border-bottom: 2px solid rgba(0, 183, 255, 0.3);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00b7ff;
            margin-bottom: 10px;
            box-shadow: 0 0 20px rgba(0, 183, 255, 0.5);
        }
        .btn-back {
            display: inline-block;
            color: #00b7ff;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 15px;
            align-self: flex-start;
            padding: 6px 12px;
            border: 1px solid rgba(0, 183, 255, 0.4);
            border-radius: 6px;
            background: rgba(0, 183, 255, 0.1);
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .page-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            text-align: left;
            border-left: 4px solid #00b7ff;
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 183, 255, 0.5);
        }
        
        /* Grid das Skins */
        .skins-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .skin-card {
            background: linear-gradient(160deg, #0d162a, #090e1a);
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            display: block;
            border: 1px solid rgba(0, 183, 255, 0.35);
            text-align: left;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, border-color 0.2s;
        }
        .skin-card:active {
            transform: scale(0.98);
            border-color: #00b7ff;
            box-shadow: 0 0 15px rgba(0, 183, 255, 0.4);
        }
        .skin-thumb {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid rgba(0, 183, 255, 0.25);
            background-color: #080d1a;
        }
        .skin-info {
            padding: 15px;
        }
        .skin-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .skin-desc {
            color: #a0b8d0;
            font-size: 0.88rem;
            margin-bottom: 12px;
        }
        .btn-view {
            background: linear-gradient(90deg, #00b7ff, #0066ff);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 7px 14px;
            border-radius: 6px;
            display: inline-block;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 183, 255, 0.4);
        }

        footer {
            margin-top: 50px;
            color: #4a6584;
            font-size: 0.85rem;
            font-weight: 600;
            border-top: 1px solid rgba(0, 183, 255, 0.2);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="global-truck-online.html" class="btn-back">← Voltar para Categorias</a>
            <img src="Marcelo Textura.png" alt="Marcelo Texturas" class="profile-img">
        </header>

        <h1 class="page-title">🛻 Skins de Camionete</h1>

        <div class="skins-grid">

            <!-- Skin 1: PMBA -->
            <a href="camionete-pmba.html" class="skin-card">
                <img src="skins%20camionete.png" alt="Skin Camionete PMBA" class="skin-thumb">
                <div class="skin-info">
                    <h2 class="skin-title">Viatura Polícia Militar da Bahia</h2>
                    <p class="skin-desc">Skin completa e detalhada da PMBA para camionete no Global Truck Online.</p>
                    <span class="btn-view">Pegar Código</span>
                </div>
            </a>

            <!-- Quando tiver mais skins de camionete, basta copiar o bloco acima e mudar a imagem e o link! -->

        </div>

        <footer>
            <p>© Marcelo Texturas - Todos os direitos reservados</p>
        </footer>
    </div>

</body>
</html>
