<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcelo Texturas - Skins de Caminhão</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f0f10;
            color: #ffffff;
            text-align: center;
            padding: 20px 15px;
        }
        header {
            padding: 20px 10px;
            border-bottom: 2px solid #222;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00e676;
            margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
        }
        h1 {
            color: #ffffff;
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        p.subheading {
            color: #aaaaaa;
            font-size: 0.85rem;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .section-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: left;
            border-left: 4px solid #00e676;
            padding-left: 10px;
            color: #dddddd;
            text-transform: uppercase;
        }
        .game-card {
            background: linear-gradient(145deg, #1a1a1c, #141416);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            display: block;
            border: 1px solid #2a2a2d;
            text-align: left;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .game-card:active {
            transform: scale(0.98);
            border-color: #00e676;
        }
        .game-cover {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid #2a2a2d;
        }
        .game-info {
            padding: 15px;
        }
        .game-card h2 {
            font-size: 1.3rem;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .game-card p {
            color: #888888;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }
        .badge {
            background-color: #00e676;
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            display: inline-block;
        }
        footer {
            margin-top: 60px;
            color: #555555;
            font-size: 0.8rem;
            border-top: 1px solid #1f1f22;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <!-- Logo enviada em formato redondo com brilho -->
        <img src="Marcelo Textura.png" alt="Marcelo Texturas" class="profile-img">
        <h1>Marcelo Texturas</h1>
        <p class="subheading">Skins exclusivas e personalizadas para jogos de caminhão</p>
    </header>

    <div class="container">
        <h2 class="section-title">Escolha o Jogo</h2>

        <!-- Card do jogo Global Truck Online -->
        <a href="global-truck-online.html" class="game-card">
            <img src="logodapagina.png" alt="Capa Global Truck Online" class="game-cover">
            <div class="game-info">
                <h2>Global Truck Online</h2>
                <p>Acesse o catálogo completo com as minhas skins criadas para este jogo.</p>
                <span class="badge">Acessar Skins</span>
            </div>
        </a>
    </div>

    <footer>
        <p>© Marcelo Texturas - Todos os direitos reservados</p>
    </footer>

</body>
</html>
