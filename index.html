<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcelo Texturas - Skins de Caminhão</title>
    <!-- Fonte estilizada do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* Fundo azul escuro detalhado com padrão moderno */
            background-color: #060913;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 140, 255, 0.25), transparent 70%),
                linear-gradient(rgba(0, 162, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 162, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            text-align: center;
            padding: 25px 15px;
            min-height: 100vh;
        }
        header {
            padding: 10px 10px 25px 10px;
            border-bottom: 2px solid rgba(0, 183, 255, 0.3);
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00b7ff;
            margin-bottom: 12px;
            box-shadow: 0 0 25px rgba(0, 183, 255, 0.6);
        }
        p.subheading {
            color: #7ce3ff;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 183, 255, 0.4);
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 18px;
            text-align: left;
            border-left: 4px solid #00b7ff;
            padding-left: 10px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(0, 183, 255, 0.5);
        }
        .game-card {
            background: linear-gradient(160deg, #0d162a, #090e1a);
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            display: block;
            border: 1px solid rgba(0, 183, 255, 0.4);
            text-align: left;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 183, 255, 0.15);
            transition: transform 0.2s, border-color 0.2s;
        }
        .game-card:active {
            transform: scale(0.98);
            border-color: #00b7ff;
            box-shadow: 0 0 20px rgba(0, 183, 255, 0.5);
        }
        .game-cover {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid rgba(0, 183, 255, 0.3);
        }
        .game-info {
            padding: 18px;
        }
        .game-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .game-card p {
            color: #a0b8d0;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 14px;
        }
        .badge {
            background: linear-gradient(90deg, #00b7ff, #0066ff);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 8px 16px;
            border-radius: 6px;
            display: inline-block;
            text-transform: uppercase;
            box-shadow: 0 0 12px rgba(0, 183, 255, 0.5);
        }
        footer {
            margin-top: 60px;
            color: #4a6584;
            font-size: 0.85rem;
            font-weight: 600;
            border-top: 1px solid rgba(0, 183, 255, 0.2);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <img src="Marcelo Textura.png" alt="Marcelo Texturas" class="profile-img">
        <p class="subheading">Skins exclusivas para jogos de caminhão</p>
    </header>

    <div class="container">
        <h2 class="section-title">Escolha o Jogo</h2>

        <a href="global-truck-online.html" class="game-card">
            <img src="logodapagina.png" alt="Capa Global Truck Online" class="game-cover">
            <div class="game-info">
                <h2>Global Truck Online</h2>
                <p>Acesse o catálogo completo com as minhas skins criadas para este jogo.</p>
                <span class="badge">Acessar Skins</span>
            </div>
        </a>
    </div>

    <footer>
        <p>© Marcelo Texturas - Todos os direitos reservados</p>
    </footer>

</body>
</html>
