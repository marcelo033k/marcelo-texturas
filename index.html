<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcelo Texturas - Skins de Caminhão</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f0f10;
            color: #ffffff;
            text-align: center;
            padding: 20px 15px;
        }
        header {
            padding: 25px 10px;
            border-bottom: 2px solid #222;
            margin-bottom: 30px;
        }
        h1 {
            color: #00e676;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        p.subheading {
            color: #aaaaaa;
            font-size: 0.95rem;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .section-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: left;
            border-left: 4px solid #00e676;
            padding-left: 10px;
            color: #dddddd;
            text-transform: uppercase;
        }
        .game-card {
            background: linear-gradient(145deg, #1a1a1c, #141416);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: white;
            display: block;
            border: 1px solid #2a2a2d;
            text-align: left;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .game-card:active {
            background: #222226;
            border-color: #00e676;
        }
        .game-card h2 {
            font-size: 1.3rem;
            color: #ffffff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .game-card p {
            color: #888888;
            font-size: 0.85rem;
        }
        .badge {
            background-color: #00e676;
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 10px;
        }
        footer {
            margin-top: 60px;
            color: #555555;
            font-size: 0.8rem;
            border-top: 1px solid #1f1f22;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Marcelo Texturas</h1>
        <p class="subheading">Skins exclusivas e personalizadas para jogos de caminhão</p>
    </header>

    <div class="container">
        <h2 class="section-title">Escolha o Jogo</h2>

        <!-- Card do jogo Global Truck Online -->
        <a href="global-truck-online.html" class="game-card">
            <h2>🚚 Global Truck Online</h2>
            <p>Acesse o catálogo completo com as minhas skins criadas para este jogo.</p>
            <span class="badge">Acessar Skins</span>
        </a>
    </div>

    <footer>
        <p>© Marcelo Texturas - Todos os direitos reservados</p>
    </footer>

</body>
</html>
